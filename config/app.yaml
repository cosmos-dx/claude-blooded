# Claude Blooded — all business configuration lives here (no values in code).
# ${VAR} / ${VAR:-default} are read from the environment; secrets only ever come from there.
# Overlay: config/app.<APP_ENV>.yaml is deep-merged on top (see app.development.yaml).

app:
  name: ${BRAND_NAME:-Reel Studio}  # shown on every page and in the free-tier watermark
  env: ${APP_ENV:-production}
  base_url: ${PUBLIC_BASE_URL:-http://localhost:8000}
  admin_emails: ${ADMIN_EMAILS:-}
  data_dir: ${DATA_DIR:-/var/lib/claude-blooded}
  timezone: Asia/Kolkata
  support_email: ${SUPPORT_EMAIL:-}   # footer contact; hidden when empty

security:
  jwt_secret: ${JWT_SECRET}
  session_hours: 72
  cookie_name: hr_session
  cookie_secure: ${COOKIE_SECURE:-true}   # set false only until HTTPS is enabled
  otp: {length: 6, ttl_minutes: 10, max_attempts: 5, resend_seconds: 45, per_email_per_hour: 5}

database:
  url: ${DATABASE_URL}
  schema: studio
  pool_min: 1
  pool_max: 4

# ---------------------------------------------------------------- products
# price_inr is GST-inclusive. Each plan grants `videos` credits of up to `max_seconds`.
plans:
  - {code: free,   name: First reel free, price_inr: 0,    videos: 1, max_seconds: 30,  tier: free,     public: false}
  - {code: spark,  name: Spark,           price_inr: 100,  videos: 3, max_seconds: 30,  tier: standard, public: true}
  - {code: boost,  name: Boost,           price_inr: 200,  videos: 3, max_seconds: 60,  tier: standard, public: true, highlight: true}
  - {code: pro,    name: Pro,             price_inr: 500,  videos: 4, max_seconds: 120, tier: standard, public: true}
  - {code: studio, name: Studio,          price_inr: 1000, videos: 7, max_seconds: 180, tier: standard, public: true}

signup_grant: {enabled: true, plan: free}

tiers:
  free:     {llm_profile: economy, tts_model: eleven_flash_v2_5, watermark: "made with {brand}"}
  standard: {llm_profile: premium, tts_model: eleven_v3,         watermark: ""}

# ---------------------------------------------------------------- models
llm:
  providers:                       # kind -> implementation in app/llm (factory)
    anthropic:
      kind: anthropic
      api_key: ${ANTHROPIC_API_KEY:-}
      supports_fallbacks: true     # server-side refusal fallbacks (Claude API only)
      capabilities: [web_search, web_fetch]   # server tools this provider runs (Claude API only)
      eager_tool_input: true       # stream client-tool inputs as they are generated
      models: {opus: claude-opus-5-5, haiku: claude-haiku-5-5}
    bedrock:
      kind: bedrock
      api_key: ${AWS_BEDROCK_API_KEY_ANTHROPIC:-}            # Bedrock API key, or the IAM key pair below
      access_key_id: ${AWS_BEDROCK_ACCESS_KEY_ID:-}          # IAM user allowed bedrock:InvokeModel*
      secret_access_key: ${AWS_BEDROCK_SECRET_ACCESS_KEY:-}
      region: ${AWS_BEDROCK_REGION:-ap-south-1}
      models: {opus: anthropic.claude-opus-5-5, haiku: anthropic.claude-haiku-5-5}
    megallm:
      kind: anthropic_compatible
      api_key: ${MEGALLM_API_KEY:-}
      base_url: https://ai.megallm.io
      models: {opus: "${MEGALLM_OPUS_MODEL:-claude-opus-5-5}", haiku: "${MEGALLM_HAIKU_MODEL:-claude-haiku-5-5}"}
    fake:
      kind: fake
      enabled: ${LLM_FAKE:-false}  # deterministic offline provider for tests
  profiles:                        # model alias + effort + provider order (first available wins, later ones are fallbacks)
    premium: {model: opus,  effort: medium, max_tokens: 24000, providers: [anthropic, bedrock, megallm, fake]}
    economy: {model: haiku, effort: low,    max_tokens: 8000,  providers: [anthropic, bedrock, megallm, fake]}
  roles:                           # agent -> profile ("tier" = the job tier's llm_profile)
    moderator: economy
    researcher: tier
    planner: tier
    voice_director: economy
    publisher: economy
    trend_scout: premium
    design_director: tier
  prices_usd_per_mtok:
    opus:  {input: 4.0, output: 20.0, cache_read: 0.20, cache_write: 5.0}
    haiku: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
  server_tool_prices_usd: {web_search: 0.01, web_fetch: 0.0}   # per call, on top of tokens
  max_tool_rounds: 8               # agent loop cap: tool calls + pause_turn resumptions per question

# ---------------------------------------------------------------- agent tools (factory: app/llm/tools.py)
tools:
  web_search:     {kind: claude_web_search, max_uses: 3, country: IN, timezone: Asia/Kolkata}
  web_fetch:      {kind: claude_web_fetch, max_uses: 2}
  contrast_check: {kind: contrast_check}
agents:
  tools:                           # always available (client tools run in this app, on any provider)
    design_director: [contrast_check]
  research:                        # live web research: needs a provider with the capability (Claude API)
    tools: {researcher: [web_search, web_fetch], design_director: [web_search, web_fetch]}
    tiers: [standard]              # free reels design and research from the model's own knowledge
    min_seconds: 60                # short reels skip web research (≈ ₹15-20 a run) to keep small packs profitable

# ---------------------------------------------------------------- voice
tts:
  provider: ${TTS_PROVIDER:-elevenlabs}
  elevenlabs:
    api_key: ${ELEVEN_LABS_API_KEY:-}
    base_url: https://api.elevenlabs.io
    usd_per_1k_chars: {eleven_v3: 0.22, eleven_flash_v2_5: 0.11}
  words_per_second: 2.3            # planning budget for spoken words
  voices:                          # catalog the Voice Director picks from
    - {code: creator-f-in,    voice_id: 8nsE0QhIEjiV3dTeTRAZ, language: en-IN, gender: female, persona: "energetic young tech creator",
       settings: {stability: 0.0, similarity_boost: 0.8, style: 0.6, use_speaker_boost: true}}
    - {code: calm-f-in,       voice_id: sZA9RXcO7cP6NwuPwtSi, language: en-IN, gender: female, persona: "calm professional interviewer",
       settings: {stability: 0.5, similarity_boost: 0.8, style: 0.2, use_speaker_boost: true}}
    - {code: young-m-in,      voice_id: Z8A2MFK71RIqBd7kkt63, language: en-IN, gender: male,   persona: "young quick engineer",
       settings: {stability: 0.0, similarity_boost: 0.8, style: 0.5, use_speaker_boost: true}}
    - {code: bhojpuri-deep-m, voice_id: TOb8uIlZyj8EyCLsz5q3, language: bho,   gender: male,   persona: "deep, slow, lazy Bihari bhaiya",
       settings: {stability: 0.5, similarity_boost: 0.85, style: 0.2, use_speaker_boost: true}}
    - {code: bhojpuri-loud-m, voice_id: mQBLY45L3SpvAlYVX5Cx, language: bho,   gender: male,   persona: "loud comic village uncle",
       settings: {stability: 0.0, similarity_boost: 0.8, style: 0.6, use_speaker_boost: true}}
  defaults: {N: creator-f-in, R: calm-f-in, C: young-m-in}
  languages:                       # what the create form offers
    - {code: en-IN, label: English (India)}
    - {code: hi-en, label: Hinglish}
    - {code: hi,    label: Hindi}
    - {code: bho,   label: Bhojpuri}

# ---------------------------------------------------------------- skills, workflow, rendering
skills:
  default: reel-tutor-01
  enabled: [reel-tutor-01, reel-kinetic-01]
  themes: {reel-tutor-01: [auto, mono, paper, ocean], reel-kinetic-01: [auto, poster, redline, forest]}   # auto = the Design Director's palette

formats:                           # output canvases; every skill renders both
  - {code: "9:16", label: Vertical,  size: [1080, 1920], for: "Reels · Shorts · TikTok"}
  - {code: "16:9", label: Landscape, size: [1920, 1080], for: "YouTube · LinkedIn · website"}

workflows:
  reel: [moderate, research, design, plan, voice, render, mix, publish]

design:
  enabled: true
  color_split: [60, 30, 10]        # dominant / secondary / accent share of screen area and time
  type_split: [60, 30, 10]         # display / text / accent share of on-screen type weight
  min_text_contrast: 7.0           # WCAG AAA: headlines and captions over the dominant colour
  min_accent_contrast: 3.0         # WCAG 1.4.11: stickers and graphics over the dominant colour
  type_scales: [1.25, 1.333, 1.414, 1.5, 1.618]   # ratios the designer may choose
  base_text_px: {"9:16": 24, "16:9": 26}          # caption size the scale grows from
  fonts:                           # installed by deploy/fetch_fonts.sh; the designer may only pick these
    - {family: anton,            weights: [400],           roles: [display],         voice: "condensed grotesque, loud, poster"}
    - {family: bebas-neue,       weights: [400],           roles: [display],         voice: "tall caps, clean, cinematic"}
    - {family: oswald,           weights: [500, 700],      roles: [display],         voice: "condensed, sturdy, newsy"}
    - {family: archivo-black,    weights: [400],           roles: [display, accent], voice: "heavy, wide, playful"}
    - {family: dm-serif-display, weights: [400],           roles: [display],         voice: "high-contrast serif, editorial, premium"}
    - {family: playfair-display, weights: [700, 900],      roles: [display, text],   voice: "classic serif, literary"}
    - {family: space-grotesk,    weights: [400, 500, 700], roles: [display, text],   voice: "geometric grotesk, techy, modern"}
    - {family: inter,            weights: [400, 500, 600], roles: [text],            voice: "neutral, highly legible UI sans"}
    - {family: jetbrains-mono,   weights: [400, 600],      roles: [text, accent],    voice: "developer mono, precise"}
    - {family: ibm-plex-mono,    weights: [400, 600],      roles: [accent],          voice: "corporate mono, calm"}
    - {family: space-mono,       weights: [400, 700],      roles: [accent],          voice: "retro mono, quirky"}

render:
  processes: ${RENDER_PROCESSES:-1}
  font_dir: ${REEL_FONT_DIR:-/usr/share/fonts/reel}
  length_tolerance_seconds: 3
  shorten_rounds: 2
  loudness: {voice: "I=-14:TP=-1.5:LRA=11", bed: "I=-20:TP=-2:LRA=11"}

worker:
  poll_seconds: 3
  job_timeout_minutes: 60
  max_attempts: 1

storage:
  provider: local
  retention_minutes: 30
  files: [reel.mp4, reel-no-voice.mp4, captions.srt, script.md, publish.md]

payments:
  gateway: ${PAYMENT_GATEWAY:-razorpay}
  currency: INR
  gst_percent: 18                  # plan prices include GST
  gateway_fee_percent: 2
  razorpay:
    key_id: ${RAZORPAY_KEY_ID:-}
    key_secret: ${RAZORPAY_KEY_SECRET:-}
    webhook_secret: ${RAZORPAY_WEBHOOK_SECRET:-}
    api_base: https://api.razorpay.com/v1

mail:
  provider: ${MAIL_PROVIDER:-smtp}
  smtp:
    host: ${SMTP_HOST:-}
    port: ${SMTP_PORT:-587}
    user: ${SMTP_USER:-}
    password: ${SMTP_PASSWORD:-}
    from_email: ${SMTP_FROM_EMAIL:-}

money: {usd_inr: "${USD_INR:-88}"}

limits:
  jobs_running_per_user: 2
  prompt_max_chars: 1500

moderation:
  enabled: true
  allow_profanity: true            # comedy/regional slang allowed; hate, harassment of real people and sexual content are not

trends:
  enabled: ${TRENDS_ENABLED:-false}
  youtube_api_key: ${YOUTUBE_API_KEY:-}
  region: IN
  run_hour_ist: 6
  niches: [tech interviews, system design, coding, careers in tech]

developers:                        # personal access tokens, the MCP server (/mcp/) and community skill packs
  token_prefix: rk_
  max_tokens_per_user: 10
  catalog_ttl_seconds: 60          # how quickly an approved pack shows up in the style list
  mcp_extra_hosts: []              # Host headers accepted besides PUBLIC_BASE_URL's (e.g. a second domain)

ui:
  show_costs_to_users: false       # admins always see costs
